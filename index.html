<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#eff8f3" />
  <meta name="description" content="扬扬成长助手：离线记录喂奶、尿尿和便便，掌握喂养规律。" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="扬扬成长" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml" />
  <title>扬扬成长助手</title>
  <style>
    :root{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;color:#263d38;background:#f7faf8;--ink:#263d38;--muted:#7d918a;--green:#326e5d;--pale:#e5f5eb;--line:#e5ede8;--shadow:0 11px 35px rgba(39,86,68,.07)}
    *{box-sizing:border-box}body{margin:0;min-width:320px}button,input,select,textarea{font:inherit}button{cursor:pointer}button:disabled{opacity:.5;cursor:default}a{color:var(--green)}
    .shell{width:min(100%,520px);margin:0 auto;min-height:100vh;padding:0 18px calc(102px + env(safe-area-inset-bottom));background:linear-gradient(164deg,#eaf7f0 0,#f6fbf8 240px,#f7faf8 241px)}
    .hero{padding:32px 4px 23px}.eyebrow{font-size:12px;letter-spacing:2px;font-weight:700;color:#579280}.topline{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}.mini-pill{font-size:12px;font-weight:650;border-radius:100px;padding:8px 12px;background:#ffffffae;color:#648679;border:1px solid #e0f0e7}.hero h1{font-size:29px;letter-spacing:-1px;margin:0 0 5px;font-weight:800}.hero p{font-size:13px;color:#6e8b80;margin:0}.avatar{width:56px;height:56px;display:grid;place-items:center;background:#fbfffd;border-radius:20px;border:1px solid #dbeee2;box-shadow:var(--shadow);font-size:28px}
    .section{margin-top:23px}.section-title{font-size:17px;font-weight:790;margin:0 0 13px;display:flex;align-items:center;justify-content:space-between}.section-title small{font-size:12px;font-weight:500;color:var(--muted)}
    .cards{display:grid;grid-template-columns:1fr 1fr;gap:11px}.card{background:#fff;border:1px solid #eef3ef;border-radius:21px;box-shadow:var(--shadow);padding:17px}.card-label{font-size:12px;color:var(--muted);display:flex;gap:6px;align-items:center}.metric{font-size:30px;letter-spacing:-1.2px;font-weight:800;margin-top:12px}.metric small{font-size:13px;font-weight:600;letter-spacing:0;color:var(--muted)}.sub{font-size:12px;color:var(--muted);margin-top:7px}
    .remind{background:linear-gradient(110deg,#316e5c,#4a9479);border-radius:23px;padding:19px 20px;color:#fff;box-shadow:0 12px 32px rgba(41,108,84,.16)}.remind .r-top{display:flex;align-items:center;justify-content:space-between;font-size:12px;color:#d5efe2}.remind .r-main{font-size:31px;font-weight:800;margin:7px 0 4px}.remind .r-sub{font-size:12px;color:#ddf3e6;line-height:1.6}.remind button{background:#ffffff24;color:white;border:1px solid #ffffff55;border-radius:12px;padding:8px 12px;font-weight:700}
    .quick-actions{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.quick{border:0;text-align:center;border-radius:19px;padding:15px 4px 16px;background:#fff;box-shadow:var(--shadow);color:#33554a}.quick .bubble{display:grid;place-items:center;font-size:24px;margin:0 auto 8px;width:45px;height:45px;border-radius:16px}.quick:nth-child(1) .bubble{background:#fff1e7}.quick:nth-child(2) .bubble{background:#e8f3ff}.quick:nth-child(3) .bubble{background:#fff2d8}.quick strong{font-size:14px}.quick:active{transform:scale(.98)}
    .timeline{background:#fff;border:1px solid #edf3ef;border-radius:21px;padding:7px 15px;box-shadow:var(--shadow)}.event{display:flex;gap:13px;padding:15px 2px;align-items:flex-start}.event+.event{border-top:1px solid #f0f3f0}.event-icon{width:40px;height:40px;display:grid;place-items:center;border-radius:14px;flex:none;font-size:20px;background:#f4f5ec}.event-icon.feed{background:#fff1e7}.event-icon.diaper{background:#e8f3ff}.event-icon.care{background:#f0eefe}.event-body{flex:1;min-width:0}.event-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px}.event-head strong{font-size:14px}.event-head time{font-size:13px;color:#7b8f85;font-variant-numeric:tabular-nums}.event-body p{margin:5px 0 0;font-size:12px;color:#83958f;line-height:1.5;overflow-wrap:anywhere}.tiny-action{border:none;background:transparent;color:#6f9387;font-size:12px;padding:6px 0 6px 6px}
    .empty{padding:32px 18px;text-align:center;color:#91a19c;font-size:13px;line-height:1.8}.empty .em{font-size:32px;margin-bottom:4px}
    .bottom-nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(100%,520px);z-index:12;background:#fffffff2;border-top:1px solid #e4ece6;backdrop-filter:blur(18px);display:grid;grid-template-columns:repeat(4,1fr);padding:12px 6px calc(10px + env(safe-area-inset-bottom));box-shadow:0 -4px 28px #253c3010}.nav-item{display:flex;align-items:center;flex-direction:column;gap:4px;background:transparent;border:0;color:#91a19b;font-size:11px;padding:0}.nav-item .nav-ico{font-size:21px}.nav-item.active{color:var(--green);font-weight:800}
    .bar-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:12px 0}.day-heading{font-size:20px;font-weight:780}.day-control{display:flex;gap:5px;align-items:center}.arrow{background:white;border:1px solid var(--line);border-radius:12px;min-width:36px;height:36px;color:#376c5b}.date-input{border:1px solid var(--line);background:white;border-radius:12px;padding:8px 10px;font-size:12px;max-width:158px;min-height:36px}
    .row-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:17px 0}.stat-small{text-align:center;background:#fff;border:1px solid #ebf1ec;border-radius:17px;padding:14px 3px}.stat-small strong{font-size:18px;display:block}.stat-small small{font-size:11px;color:var(--muted);display:block;margin-top:4px}.filter-chip{border-radius:100px;padding:8px 14px;background:white;border:1px solid var(--line);font-size:12px;color:#688477;margin-right:7px}.filter-chip.active{background:#dcefe4;border-color:#b9dac7;color:#326f58;font-weight:700}
    .chart{display:flex;gap:8px;align-items:end;height:190px;padding:16px 5px 0;background:linear-gradient(#fff,#fff) padding-box}.chart-col{display:flex;flex-direction:column;align-items:center;justify-content:end;gap:7px;flex:1;height:100%}.chart-bar-wrap{display:flex;align-items:end;height:140px;width:100%;justify-content:center}.chart-bar{width:min(30px,90%);border-radius:9px 9px 4px 4px;min-height:3px;background:linear-gradient(#87cda9,#459b74)}.chart-col.active .chart-bar{background:linear-gradient(#f6c994,#f1a561)}.chart-label{font-size:10px;color:#80948b}.chart-value{font-size:10px;font-weight:700;color:#49715f}.tip{background:#ecf7f0;border:1px solid #d9eddf;border-radius:15px;padding:12px 14px;font-size:12px;color:#638a74;line-height:1.8}
    .setting-block{background:#fff;border-radius:20px;padding:8px 17px;margin:13px 0;box-shadow:var(--shadow);border:1px solid #eef3ef}.setting-row{padding:17px 0;display:flex;justify-content:space-between;align-items:center;gap:10px}.setting-row+.setting-row{border-top:1px solid #f0f4f1}.setting-row h3{font-size:14px;margin:0 0 4px}.setting-row p{font-size:12px;color:#8ca09a;margin:0;line-height:1.5}.setting-row input[type=number]{width:76px;padding:9px;border:1px solid var(--line);border-radius:11px;text-align:right}.setting-row select{padding:9px;border:1px solid var(--line);border-radius:11px;background:white}.toggle{appearance:none;width:45px;height:27px;background:#d5ded8;border-radius:25px;position:relative;cursor:pointer;flex:none}.toggle:before{content:"";width:21px;height:21px;position:absolute;background:white;border-radius:50%;left:3px;top:3px;box-shadow:0 1px 3px #0002;transition:transform .2s}.toggle:checked{background:#398d69}.toggle:checked:before{transform:translateX(18px)}
    .btn{background:var(--green);color:white;border:0;border-radius:13px;font-weight:750;padding:12px 16px;font-size:14px}.btn-alt{background:#e7f4ec;color:#347359}.btn-outline{background:white;color:#426c5b;border:1px solid #cedfd4}.btn-danger{background:#fff0ef;color:#a74c43}.btn-wide{width:100%}.btn:active{filter:brightness(.96)}.btn-row{display:flex;flex-wrap:wrap;gap:9px;margin-top:10px}.btn-row>.btn{flex:1}
    .modal-back{position:fixed;inset:0;background:#152b25aa;backdrop-filter:blur(4px);z-index:20;display:flex;align-items:end;justify-content:center}.modal{width:min(100%,520px);max-height:min(90dvh,850px);overflow:auto;background:#fafdfb;border-radius:26px 26px 0 0;padding:21px 20px calc(24px + env(safe-area-inset-bottom));box-shadow:0 -8px 40px #0002}.modal-title{display:flex;justify-content:space-between;align-items:center;margin-bottom:17px}.modal-title h2{margin:0;font-size:20px}.close{border:0;background:#edf3ee;color:#567b6c;width:34px;height:34px;border-radius:50%;font-size:22px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{display:flex;flex-direction:column;gap:7px;margin-bottom:15px}.field label{font-size:12px;font-weight:750;color:#5a746a}.field input,.field select,.field textarea{border:1px solid #dce8df;border-radius:12px;background:#fff;padding:12px;color:#304f41;min-width:0;width:100%;outline:none}.field textarea{min-height:70px;resize:vertical}.field input:focus,.field select:focus,.field textarea:focus{border-color:#6dae89;box-shadow:0 0 0 3px #d6f0e1}.amount-presets{display:flex;flex-wrap:wrap;gap:7px;margin:-3px 0 14px}.preset{border:1px solid #dde8df;background:white;border-radius:100px;padding:9px 12px;font-size:12px;color:#60816d}.preset.active{background:#dcf2e5;border-color:#81bd98;color:#297450;font-weight:800}.choice-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px}.choice{border:1px solid #dfeae3;border-radius:13px;background:#fff;padding:10px 3px;font-size:13px;color:#5e786c}.choice.active{background:#e2f4e9;color:#266e50;border-color:#88c6a1;font-weight:800}
    .toast{position:fixed;bottom:calc(83px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);background:#2b5144;color:white;border-radius:14px;padding:12px 16px;z-index:40;font-size:13px;box-shadow:0 10px 28px #16362843;display:flex;align-items:center;gap:14px;max-width:calc(100% - 30px);min-width:200px}.toast button{background:#ffffff24;border:0;border-radius:8px;color:white;padding:6px 8px;white-space:nowrap}.muted{color:var(--muted)}.hidden{display:none!important}.footer-tip{font-size:11px;text-align:center;color:#a2b3aa;margin:24px 10px 0;line-height:1.7}.link-btn{background:transparent;border:0;color:var(--green);font-size:12px;padding:4px 0;font-weight:700}.pill-dot{display:inline-block;border-radius:50%;height:7px;width:7px;background:#63bc8b;margin-right:5px}
    @media (min-width:700px){body{background:#e5f0e9}.shell{box-shadow:0 0 80px #233d2b18}.bottom-nav{box-shadow:0 -4px 30px #0001}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
  </style>
</head>
<body>
<div id="app" class="shell"></div>
<nav id="nav" class="bottom-nav" aria-label="主导航"></nav>
<div id="modalHost"></div>
<div id="toastHost"></div>
<input id="importFile" type="file" accept="application/json,.json" hidden />
<script src="app.js" defer></script>
</body>
</html>
